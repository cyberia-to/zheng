[package]
name = "zheng"
version = "0.4.0"
edition = "2024"
description = "proof system: SuperSpartan IOP + Brakedown PCS + sumcheck"
license-file = "LICENSE"
repository = "https://github.com/cyberia-to/zheng"
keywords = ["zk", "sumcheck", "brakedown", "cyber"]
categories = ["cryptography"]

[dependencies]
nebu = { package = "strata-nebu", version = "0.1", path = "../../strata/nebu/rs" }
hemera = { package = "cyber-hemera", version = "0.3", path = "../../hemera/rs" }
nox = { package = "cyber-nox", version = "0.3.0", path = "../../nox/rs", features = ["brakedown"] }
lens = { package = "cyber-lens", version = "0.2.0", path = "../../lens/src" }
serde = { version = "1", features = ["derive"], optional = true }
getrandom = "0.3"
zeroize = "1"

[features]
# The retired 0.3.x folded trace API: commit/open/verify_eval/verify/fold/
# decide, the universal CCS (`ccs`), HyperNova folding (`folding`) and phi
# SpMV. UNSOUND (fold unchecked, statement unbound — specs/decider.md); kept
# off by default so external consumers can migrate. Never enable it on a
# production path.
legacy = []
# proof artifact wire form: Statement + TraceProof (and everything inside)
# Serialize/Deserialize; Goldilocks rides nebu's canonical-u64 form,
# Commitment/Opening ride lens's existing serde feature.
serde = ["dep:serde", "nebu/serde", "lens/serde"]

[dev-dependencies]
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }

[[example]]
name = "legacy_wire_cost"
required-features = ["serde", "legacy"]
