      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/honeycrisp
          path: honeycrisp
          ref: ${{ env.HONEYCRISP_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zheng
      - name: run
        working-directory: zheng
        run: |
          set -o pipefail
          cargo test --locked --release -p zheng --lib -- --exact --nocapture execution::veil::tests::seeded_proofs_do_not_depend_on_the_thread_count 2>&1 | tee ../b.txt || true
  c_wrap_chain:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          path: zheng
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/strata
          path: strata
          ref: ${{ env.STRATA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/hemera
          path: hemera
          ref: ${{ env.HEMERA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/lens
          path: lens
          ref: ${{ env.LENS_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/nox
          path: nox
          ref: ${{ env.NOX_REF }}
      - uses: actions/checkout@v4
        with:
