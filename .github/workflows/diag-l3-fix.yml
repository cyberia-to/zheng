      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/honeycrisp
          path: honeycrisp
          ref: ${{ env.HONEYCRISP_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zheng
      - name: run
        working-directory: zheng
        run: |
          set -o pipefail
          ZHENG_THREADS=1 cargo test --locked --release -p zheng --lib -- --exact --nocapture execution::veil::tests::seeded_proofs_do_not_depend_on_the_thread_count 2>&1 | tee ../b.txt || true
