# DIAGNOSTIC — never merged, never a PR (soft3 director plan, row L3b), round 2.
# Round 1 (run 40273927146) found no chain <= 64 KiB up to grinding 30 / fold 5;
# the bound fell ~900 B per +2 grinding bits at 10f fold 5, so this round extends
# grinding 30..40 and fold 5..8 on the shipped inner chain at IVC 1/16, 2^15
# (round 1: inner chain and IVC rate do not move the final bound).
# The frontier of the wrap chain under hemera 0.4, lambda fixed (every ledger row
# >= 128 bits is wrap's own derivation): final-proof bytes over rate, grinding,
# folding and levels (shape only, `wrap_chain`), and prover time for the shipped
# chain and three candidates (`wrap_bench`, add.tri). Base: zheng#73 4c9005e +
# diag/l3-sweep-fix (wrap_chain census).
name: diag-l3b-frontier-2

on:
  push:
    branches: [diag/l3b-frontier-2]

env:
  CARGO_TERM_COLOR: always
  HEMERA_REF: release/0.4
  LENS_REF: release/0.2
  NOX_REF: release/0.4
  STRATA_REF: ""
  TADE_REF: ""
  HONEYCRISP_REF: ""

jobs:
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        ivc: ["4:15"]
        inner: ["4i:16,7i:22"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: zheng
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/strata
          path: strata
          ref: ${{ env.STRATA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/hemera
          path: hemera
          ref: ${{ env.HEMERA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/lens
          path: lens
          ref: ${{ env.LENS_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/nox
          path: nox
          ref: ${{ env.NOX_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/tade
          path: tade
          ref: ${{ env.TADE_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/honeycrisp
          path: honeycrisp
          ref: ${{ env.HONEYCRISP_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zheng
      - name: grid
        working-directory: zheng
        run: |
          set -o pipefail
          IFS=: read RATE STEP <<< "${{ matrix.ivc }}"
          specs=()
          for r in 8 9 10; do for p in 30 32 34 36 38 40; do for k in 5 6 7 8; do
            specs+=("${{ matrix.inner }},${r}f:${p}:${k}")
          done; done; done
          ZHENG_RATE=$RATE ZHENG_STEP=$STEP cargo run --locked --release -p zheng --example wrap_chain -- "${specs[@]}" 2>&1 | grep -vE "Compiling|Finished|Running|Updating|warning" | tee ../shape.txt || true
          tag=$(echo "ivc${RATE}s${STEP}_${{ matrix.inner }}" | tr ',:' '_-')
          echo "TAG=$tag" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: shape-${{ env.TAG }}
          path: shape.txt

