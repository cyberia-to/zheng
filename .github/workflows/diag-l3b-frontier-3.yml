# DIAGNOSTIC — never merged, never a PR (soft3 director plan, row L3b), round 4.
# Round 3 (run 40287758728): control 9f:26:5 56:50 wall, FINAL 71,653 B; both
# 64 KiB candidates cancelled at the 355-min cap with no output (grep buffered
# into tee). Round 4 = round 3 with ZHENG_TIMING (per-phase laps, grinding
# rounds and permutation counts) and line-buffered output, so the control gives
# the grinding throughput and the candidates show the phase they reached.
# Round 2 (run 40287282242) found 8 chains <= 64 KiB, all fold 5, grinding >= 32.
# This round proves two of them and a control end to end (wrap_bench add.tri,
# IVC 1/16 at 2^15): 9f:36:5 (fits at the shipped rate), 10f:32:5 (fits with the
# least grinding), 9f:26:5 (shipped grinding at fold 5, to separate the costs).
# The frontier of the wrap chain under hemera 0.4, lambda fixed (every ledger row
# >= 128 bits is wrap's own derivation): final-proof bytes over rate, grinding,
# folding and levels (shape only, `wrap_chain`), and prover time for the shipped
# chain and three candidates (`wrap_bench`, add.tri). Base: zheng#73 4c9005e +
# diag/l3-sweep-fix (wrap_chain census).
name: diag-l3b-frontier-4

on:
  push:
    branches: [diag/l3b-frontier-2]

env:
  CARGO_TERM_COLOR: always
  ZHENG_TIMING: "1"
  HEMERA_REF: release/0.4
  LENS_REF: release/0.2
  NOX_REF: release/0.4
  STRATA_REF: ""
  TADE_REF: ""
  HONEYCRISP_REF: ""

jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        wrap: ["4i:16,7i:22,9f:36:5", "4i:16,7i:22,10f:32:5", "4i:16,7i:22,9f:26:5"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: zheng
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/strata
          path: strata
          ref: ${{ env.STRATA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/hemera
          path: hemera
          ref: ${{ env.HEMERA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/lens
          path: lens
          ref: ${{ env.LENS_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/nox
          path: nox
          ref: ${{ env.NOX_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/tade
          path: tade
          ref: ${{ env.TADE_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/honeycrisp
          path: honeycrisp
          ref: ${{ env.HONEYCRISP_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zheng
      - name: bench
        working-directory: zheng
        run: |
          set -o pipefail
          nproc; lscpu | grep -E 'Model name|^CPU\(s\)'
          ZHENG_RATE=4 ZHENG_STEP=15 ZHENG_WRAP="${{ matrix.wrap }}" /usr/bin/time -v cargo run --locked --release -p zheng --example wrap_bench -- add.tri 2>&1 | grep --line-buffered -vE "Compiling|Downloaded|Downloading" | tee ../time.txt || true
          echo "TAG=$(echo '${{ matrix.wrap }}' | tr ',:' '_-')" >> $GITHUB_ENV
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-${{ env.TAG }}
          path: time.txt
